# Template: hanya variabel BACKEND_* yang diganti (NGINX_ENVSUBST_FILTER),
# variabel nginx seperti $host dan $uri tidak tersentuh.

# Untuk header Connection pada WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # REST API -> backend
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Balasan AI (Ollama) bisa lama.
        proxy_read_timeout 120s;
    }

    # Socket.IO (WebSocket) -> backend
    location /socket.io/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Koneksi WebSocket dibiarkan terbuka lama.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # File hasil build punya hash di namanya -> aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: route lain dikembalikan ke index.html (jangan di-cache).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
